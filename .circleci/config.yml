version: 2.1

executors:
  macos-runner:
    macos:
      xcode: 16.0.0
    resource_class: macos.m1.medium.gen1

jobs:
  build-ios:
    executor: macos-runner
    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: 1. 配置環境變量文件
          command: cp .env.template .env

      - run:
          name: 2. 安裝 Go 與 Rust 構建環境
          command: |
            brew install go
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo 'source $HOME/.cargo/env' >> $BASH_ENV
            source $BASH_ENV
            rustup update stable
            rustup target add aarch64-apple-ios

      - run:
          name: 3. 安裝 Flutter SDK 並禁用 SPM
          command: |
            git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter config --no-enable-swift-package-manager
            flutter doctor

      - run:
          name: 4. 準備 Flutter 依賴與清理緩存
          command: |
            source $BASH_ENV
            rm -rf ios/Flutter/ephemeral
            rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
            rm -rf ~/Library/Developer/Xcode/DerivedData
            rm -rf build/ios
            flutter precache --ios
            flutter pub get
            dart run build_runner build --delete-conflicting-outputs

      - run:
          name: 5. 執行 Python 腳本修正項目配置并安裝 Pod
          command: |
            source $BASH_ENV
            python3 scripts/fix_ios.py
            cd ios
            rm -rf Pods Podfile.lock
            pod install --repo-update
            cd ..

      - run:
          name: 6. 構建 iOS App（未簽名）
          command: |
            source $BASH_ENV
            flutter build ios --release --no-codesign

      - run:
          name: 7. 打包為 .ipa 產物
          command: |
            cd build/ios/iphoneos
            mkdir Payload
            mv Runner.app Payload/
            zip -r Runner.ipa Payload

      - store_artifacts:
          path: build/ios/iphoneos/Runner.ipa
          destination: Runner.ipa

workflows:
  build-and-deploy:
    jobs:
      - build-ios