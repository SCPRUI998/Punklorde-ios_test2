version: 2.1

executors:
  macos-runner:
    macos:
      xcode: "16.0.0"
    resource_class: macos.m1.medium.gen1

jobs:
  build-ios:
    executor: macos-runner
    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: 1. 配置環境變量文件
          command: cp .env.template .env

      # 恢復 Flutter、Rust、Pub 緩存
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "pubspec.lock" }}
            - v1-deps-

      - run:
          name: 2. 安裝 Go 與 Rust 構建環境
          command: |
            brew install go
            if ! command -v rustup &> /dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            fi
            echo 'source $HOME/.cargo/env' >> $BASH_ENV
            source $BASH_ENV
            rustup target add aarch64-apple-ios

      - run:
          name: 3. 安裝或復用 Flutter SDK
          command: |
            if [ ! -d "$HOME/flutter" ]; then
              git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
            fi
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter config --no-enable-swift-package-manager

      - run:
          name: 4. 準備 Flutter 依賴與清理緩存
          command: |
            source $BASH_ENV
            rm -rf ios/Flutter/ephemeral
            rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
            rm -rf ~/Library/Developer/Xcode/DerivedData
            rm -rf build/ios
            flutter pub get
            dart run build_runner build --delete-conflicting-outputs

      - run:
          name: 5. 執行 Python 腳本修正項目配置并安裝 Pod
          command: |
            source $BASH_ENV
            python3 scripts/fix_ios.py
            cd ios
            pod install
            cd ..

      # 保存依賴緩存，加速下一次 Pipeline 執行
      - save_cache:
          key: v1-deps-{{ checksum "pubspec.lock" }}
          paths:
            - ~/flutter
            - ~/.cargo
            - ~/.pub-cache

      - run:
          name: 6. 構建 iOS App（未簽名）
          command: |
            source $BASH_ENV
            flutter build ios --release --no-codesign

      - run:
          name: 7. 打包為 .ipa 產物
          command: |
            cd build/ios/iphoneos
            mkdir Payload
            mv Runner.app Payload/
            zip -r Runner.ipa Payload

      - store_artifacts:
          path: build/ios/iphoneos/Runner.ipa
          destination: Runner.ipa

workflows:
  build-and-deploy:
    jobs:
      - build-ios