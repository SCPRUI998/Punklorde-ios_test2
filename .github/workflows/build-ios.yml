name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置环境变量文件
        run: cp .env.template .env

      - name: 3. 安装 Rust 编译环境
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 4. 安装 Flutter 环境并禁用 SPM
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 5. 准备 Flutter 依赖与代码生成
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: 6. 重写标准 Podfile 并手动安装 CocoaPods 依赖
        run: |
          cat << 'EOF' > ios/Podfile
          platform :ios, '14.0'
          use_modular_headers!

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
          end
          EOF

          # 强制修改 Xcode 工程最低版本
          python3 -c "
          import re
          pbx_path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(pbx_path, 'r', encoding='utf-8', errors='ignore') as f:
              pbx = f.read()
          pbx = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;', pbx)
          with open(pbx_path, 'w', encoding='utf-8') as f:
              f.write(pbx)
          "

          # 显式执行 Pod 安装
          cd ios
          pod install --repo-update
          cd ..

      - name: 7. 编译 iOS App（未签名，禁用 Flutter 自动覆盖 Pods）
        run: flutter build ios --release --no-codesign --no-pod-install

      - name: 8. 将打包产物封装为 .ipa 格式
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: 9. 上传 IPA 文件至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Punklorde-iOS-Unsigned
          path: build/ios/iphoneos/Runner.ipa