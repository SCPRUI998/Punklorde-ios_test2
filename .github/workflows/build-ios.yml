name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置环境变量文件
        run: cp .env.template .env

      - name: 3. 安装 Go 语言环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. 安装 Rust 编译环境
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 5. 安装 Flutter 环境并禁用 SPM
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 6. 准备 Flutter 依赖与清理缓存
        run: |
          flutter config --no-enable-swift-package-manager

          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build/ios

          flutter precache --ios
          flutter pub get

          dart run build_runner build --delete-conflicting-outputs

      - name: 7. 修复 zstandard_ios 并安装 CocoaPods
        run: |
          set -e

          echo "===== 修复 zstandard_ios podspec ====="

          python3 - <<'PY'
          import glob
          import re

          for ps in glob.glob(
              'ios/.symlinks/plugins/zstandard_ios/**/*.podspec',
              recursive=True
          ):
              print(f"Processing: {ps}")

              with open(ps, 'r', encoding='utf-8') as f:
                  content = f.read()

              # 删除原有 public_header_files
              content = re.sub(
                  r's\.public_header_files\s*=\s*\[[^\]]*\]\s*',
                  '',
                  content,
                  flags=re.DOTALL
              )

              content = re.sub(
                  r's\.public_header_files\s*=\s*[^\n]*\n',
                  '',
                  content
              )

              # 添加正确的插件头文件范围
              if "s.public_header_files = 'Classes/**/*Plugin*.h'" not in content:
                  content += "\ns.public_header_files = 'Classes/**/*Plugin*.h'\n"

              with open(ps, 'w', encoding='utf-8') as f:
                  f.write(content)

          print("zstandard_ios podspec patch completed.")
          PY

          echo "===== 检查 flutter_foreground_task 配置 ====="

          if [ -d "ios/.symlinks/plugins/flutter_foreground_task" ]; then
            echo "flutter_foreground_task plugin found."

            find ios/.symlinks/plugins/flutter_foreground_task -maxdepth 3 \
              -type f \
              \( -name "*.podspec" -o -name "*.swift" -o -name "*.h" \) \
              -print
          else
            echo "flutter_foreground_task plugin directory not found."
          fi

          echo "===== 清理 CocoaPods ====="

          cd ios

          rm -rf Pods
          rm -f Podfile.lock

          pod deintegrate || true
          pod install --repo-update

          cd ..

      - name: 7.5 检查 FlutterForegroundTask 插件注册
        run: |
          echo "===== GeneratedPluginRegistrant.m ====="

          if [ -f "ios/Runner/GeneratedPluginRegistrant.m" ]; then
            grep -n -E "FlutterForegroundTaskPlugin|SwiftFlutterForegroundTaskPlugin" \
              ios/Runner/GeneratedPluginRegistrant.m || true
          fi

          echo "===== flutter_foreground_task Pod ====="

          if [ -d "ios/Pods/flutter_foreground_task" ]; then
            find ios/Pods/flutter_foreground_task \
              -maxdepth 3 \
              -type f \
              | sort
          fi

          echo "===== Flutter plugin package ====="

          flutter pub deps | grep -A 3 -B 2 "flutter_foreground_task" || true

      - name: 7.6 清洗 zstandard_ios umbrella
        run: |
          set -e

          python3 - <<'PY'
          import glob
          import os

          umbrella_files = glob.glob(
              'ios/Pods/Target Support Files/zstandard_ios/*umbrella.h'
          )

          for umb in umbrella_files:
              if not os.path.exists(umb):
                  continue

              plugin_headers = glob.glob(
                  'ios/Pods/zstandard_ios/Classes/*Plugin*.h'
              )

              if plugin_headers:
                  new_content = '\n'.join(
                      f'#import <zstandard_ios/{os.path.basename(h)}>'
                      for h in plugin_headers
                  )
              else:
                  new_content = '// umbrella cleared'

              with open(umb, 'w', encoding='utf-8') as f:
                  f.write(new_content)

              print(f"Updated umbrella: {umb}")
          PY

      - name: 8. 编译 iOS App（未签名）
        run: |
          set -e

          echo "===== Flutter Doctor ====="
          flutter doctor -v

          echo "===== Flutter Version ====="
          flutter --version

          echo "===== CocoaPods Version ====="
          pod --version

          echo "===== Build iOS ====="

          flutter build ios \
            --release \
            --no-codesign \
            -v

      - name: 9. 检查编译产物
        run: |
          set -e

          echo "===== build/ios/iphoneos ====="
          ls -lah build/ios/iphoneos

          test -d build/ios/iphoneos/Runner.app

      - name: 10. 打包为 IPA
        run: |
          set -e

          cd build/ios/iphoneos

          rm -rf Payload
          mkdir Payload

          mv Runner.app Payload/

          zip -r Runner.ipa Payload

          ls -lh Runner.ipa

      - name: 11. 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Punklorde-iOS-Unsigned
          path: build/ios/iphoneos/Runner.ipa