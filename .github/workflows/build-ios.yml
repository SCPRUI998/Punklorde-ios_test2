name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置环境变量文件
        run: cp .env.template .env

      - name: 3. 强制修改 iOS 支持版本为 14.0
        run: |
          python3 -c "
          import re

          # 修改 Podfile
          with open('ios/Podfile', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          if 'platform :ios' in content:
              content = re.sub(r'#?\s*platform :ios,.*', \"platform :ios, '14.0'\", content)
          else:
              content = \"platform :ios, '14.0'\n\" + content
          with open('ios/Podfile', 'w', encoding='utf-8') as f:
              f.write(content)

          # 修改 Xcode 工程配置
          pbx_path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(pbx_path, 'r', encoding='utf-8', errors='ignore') as f:
              pbx = f.read()
          pbx = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;', pbx)
          with open(pbx_path, 'w', encoding='utf-8') as f:
              f.write(pbx)
          "

      - name: 4. 安装 Rust 编译环境
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 5. 安装 Flutter 环境并禁用 SPM 冲突
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 6. 获取依赖与生成代码
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: 7. 编译 iOS App（未签名）
        run: flutter build ios --release --no-codesign

      - name: 8. 将打包产物封装为 .ipa 格式
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: 9. 上传 IPA 文件至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Punklorde-iOS-Unsigned
          path: build/ios/iphoneos/Runner.ipa