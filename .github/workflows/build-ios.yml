name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置环境变量文件
        run: cp .env.template .env

      - name: 3. 安装 Go 语言环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. 安装 Rust 编译环境
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 5. 安装 Flutter 3.44.4 并禁用 SPM
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: 6. 准备 Flutter 依赖与清理缓存
        run: |
          flutter config --no-enable-swift-package-manager

          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build/ios

          flutter precache --ios
          flutter pub get

          dart run build_runner build --delete-conflicting-outputs

      - name: 6.5 注释 GeneratedPluginRegistrant.m 中的问题调用
        run: |
          if [ -f "ios/Runner/GeneratedPluginRegistrant.m" ]; then
            # 注释所有包含 FlutterForegroundTaskPlugin 和 registerWithRegistrar 的行
            sed -i '' '/FlutterForegroundTaskPlugin.*registerWithRegistrar/s/^/\/\//' ios/Runner/GeneratedPluginRegistrant.m
            echo "✅ Commented out FlutterForegroundTaskPlugin registration."
          fi

      - name: 7. 修复 zstandard_ios、统一部署目标、生成 Podfile 并安装 CocoaPods
        run: |
          set -e

          echo "===== 修复 zstandard_ios podspec ====="
          python3 - <<'PY'
          import glob
          import re

          for ps in glob.glob(
              'ios/.symlinks/plugins/zstandard_ios/**/*.podspec',
              recursive=True
          ):
              print(f"Processing: {ps}")

              with open(ps, 'r', encoding='utf-8') as f:
                  content = f.read()

              content = re.sub(
                  r's\.public_header_files\s*=\s*\[[^\]]*\]\s*',
                  '',
                  content,
                  flags=re.DOTALL
              )
              content = re.sub(
                  r's\.public_header_files\s*=\s*[^\n]*\n',
                  '',
                  content
              )
              if "s.public_header_files = 'Classes/**/*Plugin*.h'" not in content:
                  content += "\ns.public_header_files = 'Classes/**/*Plugin*.h'\n"

              with open(ps, 'w', encoding='utf-8') as f:
                  f.write(content)

          print("zstandard_ios podspec patch completed.")
          PY

          echo "===== 生成自定义 Podfile（含 post_install 清洗 umbrella） ====="
          cat << 'EOF' > ios/Podfile
          use_modular_headers!
          platform :ios, '15.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            pod 'SDWebImage', :modular_headers => true
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'

                if target.name.include?('zstandard_ios')
                  config.build_settings['HEADER_SEARCH_PATHS'] ||= '$(inherited) '
                  config.build_settings['HEADER_SEARCH_PATHS'] << '"${PODS_TARGET_SRCROOT}/**" '
                  config.build_settings['DEFINES_MODULE'] = 'NO'
                end
              end

              # 修复 rust_lib_punklorde 重复输出
              if target.name.include?('rust_lib_punklorde')
                target.build_phases.each do |phase|
                  if phase.respond_to?(:output_paths)
                    phase.output_paths.clear
                  end
                end
              end
            end

            # 清洗 zstandard_ios umbrella
            umbrella_dir = "#{installer.sandbox.root}/Target Support Files/zstandard_ios"
            Dir.glob("#{umbrella_dir}/*umbrella.h").each do |umb|
              if File.exist?(umb)
                plugin_headers = Dir.glob("#{installer.sandbox.root}/zstandard_ios/Classes/*Plugin*.h")
                new_content = if plugin_headers.any?
                                plugin_headers.map { |h| "#import <zstandard_ios/#{File.basename(h)}>" }.join("\n")
                              else
                                "// Umbrella cleared\n"
                              end
                File.write(umb, new_content)
                puts "✅ post_install: Overwritten umbrella: #{umb}"
              end
            end
          end
          EOF

          echo "===== 统一部署目标为 iOS 15.0 ====="
          python3 -c "
          import re, os, plistlib
          from xml.etree import ElementTree

          # 修改 Info.plist
          info_path = 'ios/Runner/Info.plist'
          if os.path.exists(info_path):
              try:
                  with open(info_path, 'rb') as f:
                      plist = plistlib.load(f)
                  plist['MinimumOSVersion'] = '15.0'
                  with open(info_path, 'wb') as f:
                      plistlib.dump(plist, f)
                  print('Updated Info.plist MinimumOSVersion to 15.0')
              except:
                  # 如果 plistlib 解析失败，用正则简单替换
                  with open(info_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  content = re.sub(r'<key>MinimumOSVersion</key>\s*<string>[0-9.]+</string>', '<key>MinimumOSVersion</key><string>15.0</string>', content)
                  with open(info_path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('Updated Info.plist MinimumOSVersion via regex.')

          # 修改 pbxproj，确保所有 target 的部署目标为 15.0
          pbx_path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(pbx_path, 'r', encoding='utf-8', errors='ignore') as f:
              pbx = f.read()
          # 替换所有 IPHONEOS_DEPLOYMENT_TARGET 出现（包括注释部分）
          pbx = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', pbx)
          # 确保 DEVELOPMENT_TEAM 和 CODE_SIGNING 设置
          if 'DEVELOPMENT_TEAM =' in pbx:
              pbx = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', 'DEVELOPMENT_TEAM = 1234567890;', pbx)
          else:
              pbx = re.sub(r'(buildSettings = \{)', r'\1\n\t\t\t\tDEVELOPMENT_TEAM = 1234567890;', pbx)
          if 'CODE_SIGNING_ALLOWED =' in pbx:
              pbx = re.sub(r'CODE_SIGNING_ALLOWED\s*=\s*[^;]+;', 'CODE_SIGNING_ALLOWED = NO;', pbx)
          else:
              pbx = re.sub(r'(buildSettings = \{)', r'\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;', pbx)
          with open(pbx_path, 'w', encoding='utf-8') as f:
              f.write(pbx)
          print('Updated pbxproj.')

          # 修改所有 xcconfig 文件
          override_flags = '\nIPHONEOS_DEPLOYMENT_TARGET = 15.0\nDEVELOPMENT_TEAM=1234567890\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\nCLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES\nENABLE_BITCODE=NO\n'
          for cfg in ['ios/Flutter/Generated.xcconfig', 'ios/Flutter/Release.xcconfig']:
              if os.path.exists(cfg):
                  with open(cfg, 'a', encoding='utf-8') as f:
                      f.write(override_flags)
                  print(f'Updated {cfg}')
          "

          echo "===== 清理并安装 CocoaPods ====="
          cd ios
          rm -rf Pods Podfile.lock
          pod deintegrate || true
          pod install --repo-update
          cd ..

      - name: 7.5 再次清洗 umbrella（第二道防线）
        run: |
          set -e

          python3 - <<'PY'
          import glob
          import os

          umbrella_files = glob.glob(
              'ios/Pods/Target Support Files/zstandard_ios/*umbrella.h'
          )

          for umb in umbrella_files:
              if not os.path.exists(umb):
                  continue

              plugin_headers = glob.glob(
                  'ios/Pods/zstandard_ios/Classes/*Plugin*.h'
              )

              if plugin_headers:
                  new_content = '\n'.join(
                      f'#import <zstandard_ios/{os.path.basename(h)}>'
                      for h in plugin_headers
                  )
              else:
                  new_content = '// umbrella cleared'

              with open(umb, 'w', encoding='utf-8') as f:
                  f.write(new_content)

              print(f"Updated umbrella: {umb}")
          PY

      - name: 8. 编译 iOS App（未签名）
        run: |
          set -e

          echo "===== Flutter Doctor ====="
          flutter doctor -v

          echo "===== Flutter Version ====="
          flutter --version

          echo "===== CocoaPods Version ====="
          pod --version

          echo "===== 再次强制注释问题行（第三道防线） ====="
          if [ -f "ios/Runner/GeneratedPluginRegistrant.m" ]; then
            sed -i '' '/FlutterForegroundTaskPlugin.*registerWithRegistrar/s/^/\/\//' ios/Runner/GeneratedPluginRegistrant.m
            sed -i '' 's/FlutterForegroundTaskPlugin/SwiftFlutterForegroundTaskPlugin/g' ios/Runner/GeneratedPluginRegistrant.m
            echo "✅ Pre-build: commented out and replaced class name."
          fi

          echo "===== 再次清洗 umbrella（第三道防线） ====="
          python3 - <<'PY'
          import glob, os
          for umb in glob.glob('ios/Pods/Target Support Files/zstandard_ios/*umbrella.h'):
              if os.path.exists(umb):
                  plugin_headers = glob.glob('ios/Pods/zstandard_ios/Classes/*Plugin*.h')
                  new_content = '\n'.join([f'#import <zstandard_ios/{os.path.basename(h)}>' for h in plugin_headers]) if plugin_headers else '// umbrella cleared'
                  with open(umb, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f'✅ Pre-build overwrite umbrella: {umb}')
          PY

          echo "===== Build iOS ====="
          flutter build ios \
            --release \
            --no-codesign \
            -v

      - name: 9. 检查编译产物
        run: |
          set -e

          echo "===== build/ios/iphoneos ====="
          ls -lah build/ios/iphoneos
          test -d build/ios/iphoneos/Runner.app

      - name: 10. 打包为 IPA
        run: |
          set -e

          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload
          ls -lh Runner.ipa

      - name: 11. 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Punklorde-iOS-Unsigned
          path: build/ios/iphoneos/Runner.ipa