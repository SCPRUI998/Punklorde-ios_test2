name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取仓库代码（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 1.1 强制清理 macOS 文件扩展属性 (xattr)
        run: |
          echo "===== 清理 com.apple.provenance 及其他扩展属性 ====="
          sudo find . -exec xattr -c {} + 2>/dev/null || true
          sudo xattr -cr . || true

      - name: 2. 配置环境变量文件
        run: cp .env.template .env

      - name: 3. 安装 Go 语言环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. 安装 Rust 编译环境与构建缓存
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 4.1 将 Cargo/Rust 工具暴露给 Xcode PhaseScript
        run: |
          sudo mkdir -p /usr/local/bin
          sudo ln -sf ~/.cargo/bin/* /usr/local/bin/

      - name: 4.2 写入 Flutter Xcode 环境配置 (.xcode.env.local)
        run: |
          echo "export PATH=\"\$HOME/.cargo/bin:/usr/local/bin:\$PATH\"" > ios/.xcode.env.local
          echo "export ENABLE_USER_SCRIPT_SANDBOXING=NO" >> ios/.xcode.env.local

      - name: 4.3 Rust 依赖与编译产物缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target

      - name: 5. 安装 Flutter 3.44.4 并禁用 SPM
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: 6. 优化网络与清理缓存
        run: |
          echo "===== 配置 ~/.curlrc 规避 CDN 握手重置 ====="
          cat << 'EOF' > ~/.curlrc
          http1.1
          retry = 10
          retry-delay = 2
          retry-max-time = 120
          EOF

          flutter config --no-enable-swift-package-manager

          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build/ios

          sudo xattr -cr . || true

          flutter precache --ios
          flutter pub get

          dart run build_runner build --delete-conflicting-outputs

      - name: 6.5 CocoaPods 依赖缓存
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 7. 修复 zstandard_ios、统一部署目标(17.0)、注入预处理宏并安装 CocoaPods
        run: |
          set -e

          echo "===== 修复 zstandard_ios podspec ====="
          python3 - <<'PY'
          import glob
          import re

          for ps in glob.glob(
              'ios/.symlinks/plugins/zstandard_ios/**/*.podspec',
              recursive=True
          ):
              print(f"Processing: {ps}")

              with open(ps, 'r', encoding='utf-8') as f:
                  content = f.read()

              content = re.sub(
                  r's\.public_header_files\s*=\s*\[[^\]]*\]\s*',
                  '',
                  content,
                  flags=re.DOTALL
              )
              content = re.sub(
                  r's\.public_header_files\s*=\s*[^\n]*\n',
                  '',
                  content
              )
              if "s.public_header_files = 'Classes/**/*Plugin*.h'" not in content:
                  content += "\ns.public_header_files = 'Classes/**/*Plugin*.h'\n"

              with open(ps, 'w', encoding='utf-8') as f:
                  f.write(content)

          print("zstandard_ios podspec patch completed.")
          PY

          echo "===== 生成自定义 Podfile（部署目标提升至 iOS 17.0） ====="
          cat << 'EOF' > ios/Podfile
          use_modular_headers!
          platform :ios, '17.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            pod 'SDWebImage', :modular_headers => true
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '17.0'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['COMPILER_INDEX_STORE_ENABLE'] = 'NO'

                # 禁用用户脚本沙盒，防止 Cargokit / Rust 构建被 Xcode 拦截
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'

                if target.name.include?('zstandard_ios')
                  config.build_settings['HEADER_SEARCH_PATHS'] ||= '$(inherited) '
                  config.build_settings['HEADER_SEARCH_PATHS'] << '"${PODS_TARGET_SRCROOT}/**" '
                  config.build_settings['DEFINES_MODULE'] = 'NO'
                end
              end

              # 修复 rust_lib_punklorde 重复输出
              if target.name.include?('rust_lib_punklorde')
                target.build_phases.each do |phase|
                  if phase.respond_to?(:output_paths)
                    phase.output_paths.clear
                  end
                end
              end
            end

            # 清洗 zstandard_ios umbrella
            umbrella_dir = "#{installer.sandbox.root}/Target Support Files/zstandard_ios"
            Dir.glob("#{umbrella_dir}/*umbrella.h").each do |umb|
              if File.exist?(umb)
                plugin_headers = Dir.glob("#{installer.sandbox.root}/zstandard_ios/Classes/*Plugin*.h")
                new_content = if plugin_headers.any?
                                plugin_headers.map { |h| "#import <zstandard_ios/#{File.basename(h)}>" }.join("\n")
                              else
                                "// Umbrella cleared\n"
                              end
                File.write(umb, new_content)
                puts "✅ post_install: Overwritten umbrella: #{umb}"
              end
            end
          end
          EOF

          echo "===== 统一部署目标并注入宏定义映射与构建优化参数 ====="
          python3 -c "
          import re, os, plistlib

          # 修改 Info.plist
          info_path = 'ios/Runner/Info.plist'
          if os.path.exists(info_path):
              try:
                  with open(info_path, 'rb') as f:
                      plist = plistlib.load(f)
                  plist['MinimumOSVersion'] = '17.0'
                  with open(info_path, 'wb') as f:
                      plistlib.dump(plist, f)
                  print('Updated Info.plist MinimumOSVersion to 17.0')
              except:
                  with open(info_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  content = re.sub(r'<key>MinimumOSVersion</key>\s*<string>[0-9.]+</string>', '<key>MinimumOSVersion</key><string>17.0</string>', content)
                  with open(info_path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('Updated Info.plist MinimumOSVersion via regex.')

          # 修改 pbxproj，确保部署目标为 17.0，禁用索引并设置预处理器宏
          pbx_path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(pbx_path, 'r', encoding='utf-8', errors='ignore') as f:
              pbx = f.read()

          pbx = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 17.0;', pbx)
          if 'DEVELOPMENT_TEAM =' in pbx:
              pbx = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', 'DEVELOPMENT_TEAM = 1234567890;', pbx)
          else:
              pbx = re.sub(r'(buildSettings = \{)', r'\1\n\t\t\t\tDEVELOPMENT_TEAM = 1234567890;', pbx)

          if 'CODE_SIGNING_ALLOWED =' in pbx:
              pbx = re.sub(r'CODE_SIGNING_ALLOWED\s*=\s*[^;]+;', 'CODE_SIGNING_ALLOWED = NO;', pbx)
          else:
              pbx = re.sub(r'(buildSettings = \{)', r'\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;', pbx)

          # 禁用 Xcode 脚本沙盒
          if 'ENABLE_USER_SCRIPT_SANDBOXING =' in pbx:
              pbx = re.sub(r'ENABLE_USER_SCRIPT_SANDBOXING\s*=\s*[^;]+;', 'ENABLE_USER_SCRIPT_SANDBOXING = NO;', pbx)
          else:
              pbx = re.sub(r'(buildSettings = \{)', r'\1\n\t\t\t\tENABLE_USER_SCRIPT_SANDBOXING = NO;', pbx)

          macro_setting = 'GCC_PREPROCESSOR_DEFINITIONS = ( \"$(inherited)\", \"FlutterForegroundTaskPlugin=SwiftFlutterForegroundTaskPlugin\", );'
          if 'GCC_PREPROCESSOR_DEFINITIONS =' in pbx:
              pbx = re.sub(r'GCC_PREPROCESSOR_DEFINITIONS\s*=\s*[^;]+;', macro_setting, pbx)
          else:
              pbx = re.sub(r'(buildSettings = \{)', r'\1\n\t\t\t\t' + macro_setting, pbx)

          with open(pbx_path, 'w', encoding='utf-8') as f:
              f.write(pbx)

          # 修改 xcconfig，注入 PATH 与编译参数
          override_flags = '\nPATH = $(HOME)/.cargo/bin:/usr/local/bin:$(PATH)\nIPHONEOS_DEPLOYMENT_TARGET = 17.0\nDEVELOPMENT_TEAM=1234567890\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\nCLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES\nENABLE_BITCODE=NO\nCOMPILER_INDEX_STORE_ENABLE=NO\nENABLE_USER_SCRIPT_SANDBOXING=NO\nGCC_PREPROCESSOR_DEFINITIONS=$(inherited) FlutterForegroundTaskPlugin=SwiftFlutterForegroundTaskPlugin\n'
          for cfg in ['ios/Flutter/Generated.xcconfig', 'ios/Flutter/Release.xcconfig']:
              if os.path.exists(cfg):
                  with open(cfg, 'a', encoding='utf-8') as f:
                      f.write(override_flags)
          "

          echo "===== 安装 CocoaPods ====="
          cd ios
          if [ ! -d "Pods" ]; then
            pod install --repo-update
          else
            pod install
          fi
          cd ..

      - name: 8. 编译 iOS App（未签名）并保存详细日志
        run: |
          set -e

          echo "===== 开始构建（详细日志将保存到 build.log） ====="
          flutter build ios \
            --release \
            --no-codesign \
            --no-pub \
            -v 2>&1 | tee build.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "构建失败，请查看 build.log"
            exit 1
          fi

      - name: 8.5 上传构建日志（无论成功与否）
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
        if: always()

      - name: 9. 打包为 IPA
        run: |
          set -e

          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload
          ls -lh Runner.ipa

      - name: 10. 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Punklorde-iOS-Unsigned
          path: build/ios/iphoneos/Runner.ipa